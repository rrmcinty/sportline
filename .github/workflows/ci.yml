name: CI

on:
  push:
    branches: [release]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Run full check (format + lint + tsc)
        run: npm run check

      - name: Run tests
        run: npm run test
